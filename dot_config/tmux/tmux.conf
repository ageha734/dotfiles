# ═══════════════════════════════════════════════════════════════
# tmux.conf — Claude Code + Terminal-first workflow
# ═══════════════════════════════════════════════════════════════

# ── Terminal & Colors ─────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB,xterm-ghostty:Tc"
set -g allow-passthrough all
set -ga update-environment "TERM TERM_PROGRAM TERM_PROGRAM_VERSION"
set -g extended-keys on
set -g default-shell /opt/homebrew/bin/fish

# ── General ───────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set -s copy-command 'pbcopy'
set -g history-limit 100000
set -g display-time 2000
set -g display-panes-time 2000
set -g focus-events on
set -sg escape-time 0
setw -g mode-keys vi
set -g status-keys vi

# ── Prefix ────────────────────────────────────────────────────
set -g prefix C-a
unbind C-b
bind C-a send-prefix


# ── Reload ────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display " reloaded"

# ── Pane Navigation (vim-style, prefix不要) ───────────────────
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ── Pane Resize ───────────────────────────────────────────────
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# ── Split (現在のディレクトリ引き継ぎ) ────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Window Navigation ─────────────────────────────────────────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-[ previous-window
bind -n M-] next-window

# ── Copy Mode (vi-style) ─────────────────────────────────────
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ═══════════════════════════════════════════════════════════════
# Menu (prefix → Space でメニュー表示)
# ═══════════════════════════════════════════════════════════════
bind Space display-menu -T " tmux" -x C -y C \
    "" "" "" \
    "-  AI  -"               "" "" \
    "  popup"                a "display-popup -d '#{pane_current_path}' -w 92% -h 88% -E 'claude'" \
    "  side pane"            A "split-window -h -l 45% -c '#{pane_current_path}' 'claude'" \
    "  new window"           w "new-window -n claude -c '#{pane_current_path}' 'claude'" \
    "" "" "" \
    "-  Tools  -"            "" "" \
    "  files"                f "display-popup -d '#{pane_current_path}' -w 90% -h 85% -E 'fish -c yazi'" \
    "  github"               g "display-popup -d '#{pane_current_path}' -w 90% -h 85% -E 'gh dash'" \
    "  monitor"              b "display-popup -d '#{pane_current_path}' -w 90% -h 85% -E 'htop'" \
    "  redis"                R "display-popup -d '#{pane_current_path}' -w 80% -h 70% -E 'redis-cli'" \
    "  database"             d "display-popup -d '#{pane_current_path}' -w 90% -h 85% -E 'nvim +DBUI'" \
    "" "" "" \
    "-  Session  -"          "" "" \
    "  list"                 s "choose-tree -sZ" \
    "  new"                  S "command-prompt -p 'name:' 'new-session -s %%'" \
    "  rename"               . "command-prompt -I '#S' 'rename-session %%'" \
    "  kill"                 X "confirm-before -p 'kill #S? (y/n)' kill-session" \
    "" "" "" \
    "-  Layout  -"           "" "" \
    "  dev (nvim+claude)"    C "new-window -n dev -c '#{pane_current_path}' \\; split-window -h -l 42% -c '#{pane_current_path}' \\; send-keys 'claude' Enter \\; split-window -v -l 30% -c '#{pane_current_path}' \\; select-pane -t 1 \\; send-keys 'nvim' Enter" \
    "  monitor"              M "new-window -n monitor -c '#{pane_current_path}' \\; send-keys 'htop' Enter \\; split-window -h -c '#{pane_current_path}' \\; split-window -v -c '#{pane_current_path}' \\; select-pane -t 1 \\; split-window -v -c '#{pane_current_path}' \\; send-keys 'redis-cli' Enter"

# ═══════════════════════════════════════════════════════════════
# Direct keybinds (メニュー経由しなくても直接使える)
# ═══════════════════════════════════════════════════════════════
bind a display-popup -d "#{pane_current_path}" -w 92% -h 88% -E "claude"
bind A split-window -h -l 45% -c "#{pane_current_path}" "claude"
bind b display-popup -d "#{pane_current_path}" -w 90% -h 85% -E "htop"
bind f display-popup -d "#{pane_current_path}" -w 90% -h 85% -E "env TERM=xterm-ghostty TERM_PROGRAM=ghostty yazi"
bind g display-popup -d "#{pane_current_path}" -w 90% -h 85% -E "gh dash"
bind R display-popup -d "#{pane_current_path}" -w 80% -h 70% -E "redis-cli"
bind d display-popup -d "#{pane_current_path}" -w 90% -h 85% -E "nvim +DBUI"

# Session
bind s choose-tree -sZ
bind S command-prompt -p "new session:" "new-session -s '%%'"
bind X confirm-before -p "kill session #S? (y/n)" kill-session
bind . command-prompt -I "#S" "rename-session '%%'"

# Layout
bind C new-window -n "dev" -c "#{pane_current_path}" \; \
    split-window -h -l 42% -c "#{pane_current_path}" \; \
    send-keys "claude" Enter \; \
    split-window -v -l 30% -c "#{pane_current_path}" \; \
    select-pane -t 1 \; \
    send-keys "nvim" Enter

bind M new-window -n "monitor" -c "#{pane_current_path}" \; \
    send-keys "htop" Enter \; \
    split-window -h -c "#{pane_current_path}" \; \
    split-window -v -c "#{pane_current_path}" \; \
    select-pane -t 1 \; \
    split-window -v -c "#{pane_current_path}" \; \
    send-keys "redis-cli" Enter

# ── Pane Border ───────────────────────────────────────────────
set -g pane-border-style "fg=#51576d"
set -g pane-active-border-style "fg=#85c1dc"
set -g pane-border-lines heavy
set -g pane-border-indicators colour

# ── Status Bar ────────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 3
set -g status-style "bg=#292c3c,fg=#c6d0f5"

# Left: session name (prefix押下中は色が変わる + ヒント表示)
set -g status-left-length 60
set -g status-left "#{?client_prefix,#[bg=#ef9f76#,fg=#232634#,bold]  C-a  #[bg=#292c3c#,fg=#ef9f76],#[bg=#85c1dc#,fg=#232634#,bold]  #S #[bg=#292c3c#,fg=#85c1dc]}"

# Right: git branch + time
set -g status-right-length 80
set -g status-right "#[fg=#51576d]#[bg=#51576d,fg=#c6d0f5]  #(cd #{pane_current_path}; git branch --show-current 2>/dev/null || echo '-') #[fg=#414559,bg=#51576d]#[bg=#414559,fg=#a5adce]  %H:%M #[fg=#85c1dc,bg=#414559]#[bg=#85c1dc,fg=#232634,bold] 󰒍 #H "

# Center: window list
set -g status-justify centre
set -g window-status-format "#[fg=#737994]  #I:#W "
set -g window-status-current-format "#[fg=#292c3c,bg=#414559]#[fg=#c6d0f5,bg=#414559,bold] #I:#W #[fg=#414559,bg=#292c3c]"
set -g window-status-separator ""

# ── Message Style ─────────────────────────────────────────────
set -g message-style "bg=#85c1dc,fg=#232634,bold"
set -g message-command-style "bg=#ef9f76,fg=#232634"

# ── Plugins ───────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'

# Continuum: auto-save every 10 min
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# ── TPM Bootstrap ─────────────────────────────────────────────
run '~/.config/tmux/plugins/tpm/tpm'
